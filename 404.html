<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Kris Nguyen</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  :root{--ink:#0A0A0A;--paper:#F4F4F2;--mute:#9A9A96}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ink);color:var(--paper);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;text-align:center;
  }
  main{max-width:36ch}
  .code{
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
    font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:0 0 18px;
  }
  h1{font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:-.03em;margin:0 0 14px;line-height:1.15}
  p{color:var(--mute);margin:0 0 28px;line-height:1.6}
  a{
    display:inline-block;color:var(--ink);background:var(--paper);
    text-decoration:none;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    padding:12px 20px;border-radius:2px;
  }
  a:hover{opacity:.85}
  :focus-visible{outline:2px solid var(--paper);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>This page doesn't exist.</h1>
  <p>The link may be old, or the address was mistyped. Everything on this site lives on one page.</p>
  <a href="/">Back to the site</a>
</main>
</body>
</html>
